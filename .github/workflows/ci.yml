name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push during review cancels the run it supersedes. The check that matters is
# the one against the commit being reviewed, not the one that started first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs only read the checkout: they install, typecheck, test and build, and
# publish nothing. The default token permission is read-write over the whole
# repository, which is far more than this workflow uses.
permissions:
  contents: read

jobs:
  backend:
    name: backend · typecheck + tests + build
    runs-on: ubuntu-latest
    # A job that hangs would otherwise hold a runner for GitHub's six-hour
    # default. This job runs in about a minute, so 15 is headroom, not a budget.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: frontend · typecheck + build
    runs-on: ubuntu-latest
    # Typecheck plus `next build`; also about a minute when the npm cache is warm.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build