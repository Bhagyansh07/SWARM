# Three npm manifests (root, backend, frontend) plus the workflow actions.
#
# Minor and patch updates arrive as one grouped pull request per
# ecosystem, capped at three open PRs each, so the queue stays short
# instead of one PR per package. Major updates are ignored outright:
# Next 14 -> 16, Tailwind 3 -> 4, TypeScript 5 -> 7, zod 3 -> 4 and
# express 4 -> 5 are each a migration, not a bump.
#
# Auto-merge is deliberately absent: every bump lands through CI.
version: 2
updates:
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "npm"
  directory: "/backend"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "npm"
  directory: "/frontend"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
